# Tableau de bord "Intercom" plein écran pour une tablette murale / de salon.
# Nécessite la carte custom:simplex-intercom-card (voir cards/simplex-intercom-card/).
#
# Version dynamique : la liste des destinataires est lue dans l'intégration
# (auto-découverte), donc aucune vue n'est à mettre à jour quand un nouveau
# contact apparaît. Pour fixer une liste précise, décommente le bloc
# "aliases" ci-dessous — il est prioritaire sur la découverte.
#
# La carte est chargée automatiquement par l'intégration (rien à déclarer).

title: Interphone SimpleX
views:
  - title: Salon
    path: simplex-intercom
    icon: mdi:chat-processing
    type: panel
    cards:
      - type: custom:simplex-intercom-card
        title: "Salon"
        # Destinataires fixes (optionnel) — sinon, découverte automatique :
        # aliases:
        #   - family
        #   - alice
        # default_alias: family
