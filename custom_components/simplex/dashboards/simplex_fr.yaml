# SimpleX Chat – dashboard Home Assistant
# --------------------------------------
# Installation (UI) :
#   1. Paramètres → Tableaux de bord → Ajouter un tableau de bord
#   2. Choisir "Tableau de bord en YAML" (ou éditer en YAML un dashboard existant)
#   3. Coller le contenu de ce fichier (section `views:` minimum)
#
# Ou copier ce fichier dans config/ et l’inclure depuis ui-lovelace.yaml / dashboards YAML.
#
# Les entity_id peuvent varier selon ta config. Adapte si besoin :
#   binary_sensor.simplex_chat_connection
#   sensor.simplex_chat_last_message
#   sensor.simplex_chat_known_contacts
#   sensor.simplex_chat_discovered_contacts
#   sensor.simplex_chat_unread_messages
#   notify.simplex_chat_<alias>

title: SimpleX Chat
views:
  - title: SimpleX
    path: simplex
    icon: mdi:message-lock
    type: sections
    max_columns: 2
    sections:
      # ---------- Statut ----------
      - type: grid
        cards:
          - type: heading
            heading: Connexion
            heading_style: title
            icon: mdi:lan-connect

          - type: tile
            entity: binary_sensor.simplex_chat_connection
            name: WebSocket
            icon: mdi:transit-connection-variant
            vertical: false
            features_position: bottom
            color: primary

          - type: tile
            entity: sensor.simplex_chat_known_contacts
            name: Contacts connus
            icon: mdi:account-multiple
            vertical: false

          - type: tile
            entity: sensor.simplex_chat_configured_contacts
            name: Configurés à la main
            icon: mdi:account-group
            vertical: false

          - type: tile
            entity: sensor.simplex_chat_discovered_contacts
            name: Découverts auto.
            icon: mdi:radar
            vertical: false

          - type: tile
            entity: sensor.simplex_chat_unread_messages
            name: Non lus
            icon: mdi:email-unread
            vertical: false

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.simplex_chat_connection
                state_not: "on"
            card:
              type: markdown
              content: |
                ⚠️ **SimpleX n’est pas connecté**

                Vérifie que le conteneur / CLI écoute bien, par ex. :
                - Docker : `ws://127.0.0.1:5225` (réseau host) ou `ws://IP_HOTE:5225`
                - Voir [DOCKER.md](https://github.com/MX10-AC2N/SimpleX-Chat_HA/blob/main/DOCKER.md)

      # ---------- Dernier message ----------
      - type: grid
        cards:
          - type: heading
            heading: Dernier message
            heading_style: title
            icon: mdi:message-text

          - type: markdown
            content: |
              {% set s = states('sensor.simplex_chat_last_message') %}
              {% if s not in ['unknown', 'unavailable', 'none', ''] %}
              **{{ state_attr('sensor.simplex_chat_last_message', 'alias') or '—' }}**
              {% if state_attr('sensor.simplex_chat_last_message', 'chat_ref') %}
              `{{ state_attr('sensor.simplex_chat_last_message', 'chat_ref') }}`
              {% endif %}

              {{ s }}
              {% else %}
              *Aucun message reçu pour le moment.*
              {% endif %}

          - type: entities
            entities:
              - entity: sensor.simplex_chat_last_message
                name: Texte
            state_color: true

      # ---------- Actions ----------
      - type: grid
        cards:
          - type: heading
            heading: Actions
            heading_style: title
            icon: mdi:lightning-bolt

          - type: markdown
            content: |
              ### Créer une invitation
              Génère un lien **depuis le bot** (recommandé), puis ouvre-le dans l’app SimpleX du téléphone.

          - type: button
            name: Créer une invitation
            icon: mdi:qrcode-plus
            tap_action:
              action: call-service
              service: simplex.create_invite
              service_data: {}
            hold_action:
              action: more-info

          - type: markdown
            content: |
              Après l’action, regarde la **réponse** dans
              *Outils de développement → Actions* (champ `invite_link`),
              ou les notifications / traces selon ta config.

          - type: markdown
            content: |
              ### Envoyer un message
              Les contacts et groupes du bot sont **découverts automatiquement** :
              une entité `notify.simplex_chat_<alias>` est créée pour chacun
              d’eux, sans rien configurer.

          - type: entities
            title: Raccourcis notify
            show_header_toggle: false
            entities:
              - type: weblink
                name: Configurer l’intégration
                url: /config/integrations/integration/simplex
                icon: mdi:cog

      # ---------- Contacts (auto-découverte) ----------
      - type: grid
        cards:
          - type: heading
            heading: Contacts
            heading_style: title
            icon: mdi:account-multiple

          - type: markdown
            content: |
              Les alias ci-dessous sont ceux des chats connus de l’intégration.
              Utilise-les dans `simplex.send_message` :

              ```
              action: simplex.send_message
              data:
                alias: alice
                message: Bonjour !
              ```

          - type: entities
            title: Entités notify (un par contact)
            show_header_toggle: false
            entities:
              - type: custom:auto-entities
                filter:
                  - domain: notify
                    integration: simplex

      # ---------- Activité ----------
      - type: grid
        cards:
          - type: heading
            heading: Activité
            heading_style: title
            icon: mdi:chart-bar

          - type: tile
            entity: sensor.simplex_chat_messages_today
            name: Messages aujourd’hui
            icon: mdi:message-text-outline
            vertical: false

          - type: tile
            entity: sensor.simplex_chat_messages_week
            name: Messages sur 7 jours
            icon: mdi:chart-line
            vertical: false

          - type: markdown
            title: Messages par jour (7 derniers jours)
            content: |
              {% set daily = state_attr('sensor.simplex_chat_messages_week', 'daily') or [] %}
              {% set mx = (daily | map(attribute='count') | max) if daily else 0 %}
              {% if mx > 0 %}
              ```
              {% for d in daily %}
              {{ d.date[5:] }} {{ '█' * (d.count * 24 // mx) }} {{ d.count }}
              {% endfor %}
              ```
              {% else %}
              _Aucune activité sur les 7 derniers jours._
              {% endif %}

      # ---------- Aide ----------
      - type: grid
        cards:
          - type: heading
            heading: Aide
            heading_style: title
            icon: mdi:help-circle

          - type: markdown
            content: |
              **Flux recommandé**
              1. Connexion WebSocket OK (tuile ci-dessus = connecté)
              2. Bouton **Créer une invitation** → coller le lien dans l’app SimpleX
              3. Ou coller un lien unique téléphone → HA dans *Configurer*

              **Services utiles**
              - `simplex.create_invite`
              - `simplex.accept_invite`
              - `simplex.send_message`
              - `simplex.send_file`
              - `simplex.list_contacts`
              - `simplex.list_groups`
              - `simplex.refresh_contacts`
              - `simplex.mark_read`

              **Événements**
              - `simplex_message_received` — message entrant
              - `simplex_targets_updated` — contact/groupe découvert
              - `simplex_error` — erreur renvoyée par le CLI

              📘 Documentation : [SimpleX-Chat_HA](https://github.com/MX10-AC2N/SimpleX-Chat_HA)
