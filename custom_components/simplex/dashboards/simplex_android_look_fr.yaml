# Écran "façon appli SimpleX Chat Android" : un fil de messages (bulles) +
# composeur texte/vocal/vidéo.
#
# Nécessite custom:simplex-chat-card (voir cards/simplex-chat-card/) et donc
# l'intégration en v2.1+ (commande WebSocket "simplex/history").
#
# thanks à l'auto-découverte, la vue ci-dessous est GÉNÉRIQUE : elle affiche
# la conversation dont l'alias est porté par le fragment de l'URL (#alias).
# Ajoute une vue par contact (en fin de fichier) si tu le souhaites.
#
# Pour arriver directement dans une conversation depuis une autre page :
#   /simplex/simplex-chat#alice

title: SimpleX
views:
  - title: Conversation
    path: simplex-chat
    icon: mdi:chat
    type: panel
    cards:
      - type: custom:simplex-chat-card
        alias: auto
        history_limit: 50

