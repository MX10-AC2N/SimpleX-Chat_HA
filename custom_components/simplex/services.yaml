send_message:
  name: Send message
  description: Send a text message to a SimpleX contact or group, either by alias or by chat reference.
  fields:
    alias:
      name: Alias
      description: The friendly name of the contact/group (configured manually or auto-discovered).
      required: false
      example: "alice"
      selector:
        text:
    chat_ref:
      name: Chat reference
      description: Raw SimpleX chat reference — "@<contactId>" for a contact, "#<groupId>" for a group. Used when no alias is given.
      required: false
      example: "@3"
      selector:
        text:
    message:
      name: Message
      description: The message body to send.
      required: true
      example: "Dinner is ready!"
      selector:
        text:
    title:
      name: Title
      description: Optional title prepended to the message.
      required: false
      example: "Home Alert"
      selector:
        text:
    entry_id:
      name: Config entry ID
      description: Optional. Required only if you have multiple SimpleX integrations.
      required: false
      selector:
        text:

send_file:
  name: Send file
  description: Send a local file (audio clip, video clip, image…) to a SimpleX contact or group. The file must be readable by the simplex-chat CLI process (shared volume if it runs in another container).
  fields:
    alias:
      name: Alias
      description: The friendly name of the contact/group (configured manually or auto-discovered).
      required: false
      example: "alice"
      selector:
        text:
    chat_ref:
      name: Chat reference
      description: Raw SimpleX chat reference — "@<contactId>" or "#<groupId>". Used when no alias is given.
      required: false
      example: "@3"
      selector:
        text:
    file_path:
      name: File path
      description: Absolute path to the file to send, as seen by Home Assistant.
      required: true
      example: "/config/simplex_outbox/clip_20261114.ogg"
      selector:
        text:
    message:
      name: Caption
      description: Optional text sent together with the file.
      required: false
      example: "Camera snapshot"
      selector:
        text:
    entry_id:
      name: Config entry ID
      description: Optional. Required only if you have multiple SimpleX integrations.
      required: false
      selector:
        text:

create_invite:
  name: Create invitation
  description: Generate a one-time SimpleX invitation link from the CLI.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional. Required only if you have multiple SimpleX integrations.
      required: false
      selector:
        text:

accept_invite:
  name: Accept invitation
  description: Accept a SimpleX invitation link and optionally store it as a named alias.
  fields:
    invite_link:
      name: Invitation link
      description: The SimpleX invitation or contact address link.
      required: true
      selector:
        text:
    alias:
      name: Alias
      description: Optional friendly name. If provided the contact is stored and a notify entity is created.
      required: false
      selector:
        text:
    entry_id:
      name: Config entry ID
      description: Optional. Required only if you have multiple SimpleX integrations.
      required: false
      selector:
        text:

list_contacts:
  name: List contacts
  description: Retrieve the list of contacts known by the SimpleX CLI.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional. Required only if you have multiple SimpleX integrations.
      required: false
      selector:
        text:

list_groups:
  name: List groups
  description: Retrieve the list of groups known by the SimpleX CLI.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional. Required only if you have multiple SimpleX integrations.
      required: false
      selector:
        text:

refresh_contacts:
  name: Refresh contacts
  description: Re-run the auto-discovery of contacts and groups, and return the resulting list of known chats.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional. Required only if you have multiple SimpleX integrations.
      required: false
      selector:
        text:

mark_read:
  name: Mark as read
  description: Mark specific chat items as read on the SimpleX side.
  fields:
    alias:
      name: Alias
      description: The friendly name of the contact/group.
      required: false
      example: "alice"
      selector:
        text:
    chat_ref:
      name: Chat reference
      description: Raw SimpleX chat reference — "@<contactId>" or "#<groupId>". Used when no alias is given.
      required: false
      example: "@3"
      selector:
        text:
    item_ids:
      name: Item IDs
      description: List of chat item ids to mark as read.
      required: true
      example: "17,18"
      selector:
        object:
    entry_id:
      name: Config entry ID
      description: Optional. Required only if you have multiple SimpleX integrations.
      required: false
      selector:
        text:

search:
  name: Search messages
  description: Search the message text across every conversation at once.
  fields:
    query:
      name: Search text
      description: The text to look for in the messages.
      required: true
      example: "dinner"
      selector:
        text:
    limit:
      name: Maximum results
      description: Maximum number of matching messages to return.
      required: false
      default: 50
      selector:
        number:
          min: 1
          max: 200
    entry_id:
      name: Config entry ID
      description: Optional. Required only if you have multiple SimpleX integrations.
      required: false
      selector:
        text:

activity_stats:
  name: Activity statistics
  description: Return the message activity — a daily series and a per-chat breakdown.
  fields:
    days:
      name: Window (days)
      description: Size of the window the statistics cover.
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 365
    entry_id:
      name: Config entry ID
      description: Optional. Required only if you have multiple SimpleX integrations.
      required: false
      selector:
        text:
