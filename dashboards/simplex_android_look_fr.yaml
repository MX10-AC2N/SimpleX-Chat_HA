# Écran "façon appli SimpleX Chat Android" : une conversation par onglet,
# chacune avec son fil de messages (bulles) + composeur texte/vocal/vidéo.
#
# Nécessite custom:simplex-chat-card (voir www/simplex-chat-card/) et donc
# l'intégration en v2.1+ (commande WebSocket "simplex/history").
#
# Remplace les alias par ceux configurés dans l'intégration.

title: SimpleX
views:
  - title: Famille
    path: simplex-family
    icon: mdi:chat
    type: panel
    cards:
      - type: custom:simplex-chat-card
        alias: family
        title: Famille
        history_limit: 50

  - title: Alice
    path: simplex-alice
    icon: mdi:account
    type: panel
    cards:
      - type: custom:simplex-chat-card
        alias: alice
        title: Alice
        history_limit: 50
