# SimpleX Chat – premium Lovelace (Mushroom + auto-entities)
# Requires: mushroom, auto-entities (HACS)

title: SimpleX Chat
views:
  - title: SimpleX
    path: simplex
    icon: mdi:message-lock-outline
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:mushroom-title-card
            title: SimpleX Chat
            subtitle: Private messaging · HA notifications

          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: "{{ 'Online' if is_state('binary_sensor.simplex_chat_connection', 'on') else 'Offline' }}"
                secondary: WebSocket
                icon: "{{ 'mdi:lan-connect' if is_state('binary_sensor.simplex_chat_connection', 'on') else 'mdi:lan-disconnect' }}"
                icon_color: "{{ 'green' if is_state('binary_sensor.simplex_chat_connection', 'on') else 'red' }}"
                layout: horizontal
                tap_action:
                  action: more-info
                  entity: binary_sensor.simplex_chat_connection
                card_mod:
                  style: |
                    ha-card {
                      background: {% if is_state('binary_sensor.simplex_chat_connection', 'on') %}
                        linear-gradient(135deg, rgba(56,142,60,0.18), rgba(56,142,60,0.05));
                      {% else %}
                        linear-gradient(135deg, rgba(211,47,47,0.18), rgba(211,47,47,0.05));
                      {% endif %}
                      border-radius: 16px;
                    }

              - type: custom:mushroom-template-card
                primary: "{{ states('sensor.simplex_chat_configured_contacts') | int(0) }}"
                secondary: HA contacts
                icon: mdi:account-multiple-outline
                icon_color: indigo
                layout: horizontal
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(135deg, rgba(63,81,181,0.16), rgba(63,81,181,0.04));
                      border-radius: 16px;
                    }

              - type: custom:mushroom-template-card
                primary: "{{ 'Active' if states('sensor.simplex_chat_last_message') not in ['unknown','unavailable','none',''] else 'Idle' }}"
                secondary: Last message
                icon: mdi:message-text-outline
                icon_color: cyan
                layout: horizontal
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(135deg, rgba(0,188,212,0.16), rgba(0,188,212,0.04));
                      border-radius: 16px;
                    }

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.simplex_chat_connection
                state_not: "on"
            card:
              type: custom:mushroom-template-card
              primary: SimpleX is unreachable
              secondary: Check container/CLI (ws://…:5225) · see DOCKER.md
              icon: mdi:alert-circle-outline
              icon_color: amber
              multiline_secondary: true
              layout: horizontal

      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Inbox
            subtitle: Last incoming message

          - type: custom:mushroom-template-card
            primary: >-
              {% set a = state_attr('sensor.simplex_chat_last_message', 'alias') %}
              {{ a if a else 'No sender' }}
            secondary: >-
              {% set s = states('sensor.simplex_chat_last_message') %}
              {% if s not in ['unknown', 'unavailable', 'none', ''] %}
                {{ s }}
              {% else %}
                Waiting for an incoming message…
              {% endif %}
            icon: mdi:inbox-arrow-down
            icon_color: teal
            multiline_secondary: true
            layout: vertical
            card_mod:
              style: |
                ha-card {
                  min-height: 120px;
                  border-radius: 18px;
                  background: linear-gradient(160deg, rgba(0,150,136,0.12), rgba(0,0,0,0));
                }

          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:at
                content: >-
                  {{ state_attr('sensor.simplex_chat_last_message', 'chat_ref') or '—' }}
              - type: template
                icon: mdi:clock-outline
                content: >-
                  {{ relative_time(states.sensor.simplex_chat_last_message.last_changed) if states.sensor.simplex_chat_last_message is defined else '—' }}

      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Actions
            subtitle: Invites & setup

          - type: custom:mushroom-template-card
            primary: Create invitation
            secondary: Bot-generated link · open in SimpleX app
            icon: mdi:qrcode-plus
            icon_color: deep-purple
            layout: horizontal
            multiline_secondary: true
            tap_action:
              action: call-service
              service: simplex.create_invite
            card_mod:
              style: |
                ha-card {
                  border-radius: 16px;
                  background: linear-gradient(135deg, rgba(103,58,183,0.18), rgba(103,58,183,0.04));
                }

          - type: custom:mushroom-template-card
            primary: List CLI contacts
            secondary: Contacts known by the SimpleX daemon
            icon: mdi:format-list-bulleted
            icon_color: blue-grey
            layout: horizontal
            tap_action:
              action: call-service
              service: simplex.list_contacts

          - type: custom:mushroom-template-card
            primary: Configure integration
            secondary: Add / remove a contact via invite link
            icon: mdi:cog-outline
            icon_color: grey
            layout: horizontal
            tap_action:
              action: navigate
              navigation_path: /config/integrations/integration/simplex

      - type: grid
        column_span: 2
        cards:
          - type: custom:mushroom-title-card
            title: Recipients
            subtitle: notify.simplex_chat_* · long-press = test message

          - type: custom:auto-entities
            card:
              type: grid
              columns: 2
              square: false
            card_param: cards
            filter:
              include:
                - domain: notify
                  entity_id: "*simplex*"
                  options:
                    type: custom:mushroom-template-card
                    primary: "{{ state_attr(config.entity, 'friendly_name') or config.entity }}"
                    secondary: "{{ config.entity }}"
                    icon: mdi:message-arrow-right-outline
                    icon_color: "#00B0FF"
                    layout: horizontal
                    tap_action:
                      action: more-info
                    hold_action:
                      action: call-service
                      service: notify.send_message
                      target:
                        entity_id: this.entity_id
                      data:
                        message: "Test SimpleX from HA dashboard"
                        title: Home Assistant
                    card_mod:
                      style: |
                        ha-card { border-radius: 14px; }
              exclude: []
            sort:
              method: friendly_name
            show_empty: true
            empty_card:
              type: custom:mushroom-template-card
              primary: No notify contacts yet
              secondary: Configure integration → Add a contact
              icon: mdi:account-plus-outline
              icon_color: disabled
              layout: horizontal
              tap_action:
                action: navigate
                navigation_path: /config/integrations/integration/simplex

      - type: grid
        column_span: 3
        cards:
          - type: custom:mushroom-title-card
            title: Quick guide
          - type: custom:mushroom-template-card
            primary: 1 · WS daemon
            secondary: simplex-bridge container or simplex-chat -p 5225
            icon: mdi:numeric-1-circle
            icon_color: "#5C6BC0"
            layout: horizontal
          - type: custom:mushroom-template-card
            primary: 2 · Invitation
            secondary: Create invitation → open link in SimpleX app
            icon: mdi:numeric-2-circle
            icon_color: "#7E57C2"
            layout: horizontal
          - type: custom:mushroom-template-card
            primary: 3 · Notify
            secondary: Recipient cards appear after adding a contact
            icon: mdi:numeric-3-circle
            icon_color: "#26A69A"
            layout: horizontal
