# Exemple de référence : Home Assistant et SimpleX Bridge partagent
# le namespace réseau host sur le même hôte Linux.
# Adaptez les volumes et options HA à votre installation existante.
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    network_mode: host
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - simplex-outbox:/config/simplex_outbox
      - simplex-inbox:/config/simplex_inbox/received_files:ro
    restart: unless-stopped

  simplex-bridge:
    image: ghcr.io/mx10-ac2n/simplex-bridge:latest
    container_name: simplex-bridge
    network_mode: host
    volumes:
      - simplex-data:/data
      - simplex-outbox:/config/simplex_outbox
      - simplex-inbox:/data/received_files
    environment:
      SIMPLEX_DISPLAY_NAME: "Home Assistant"
      SIMPLEX_AUTO_ACCEPT: "true"
      SIMPLEX_FILES_ENABLED: "true"
      SIMPLEX_FILES_DIR: "/data/received_files"
      # false = le CLI ne marque PAS les messages comme lus tout seul.
      # À true, le CLI marque chaque message reçu comme lu (option -r) :
      # les compteurs de non-lus de l'intégration et de la carte
      # "conversations" resteraient alors toujours à 0.
      # Passer à true si tu veux que la tablette consomme les messages
      # sans les marquer de ton côté.
      SIMPLEX_MARK_READ: "false"
      SIMPLEX_TOR: "false"
      SIMPLEX_STARTUP_TIMEOUT: "30"
      PUID: "99"
      PGID: "100"
      TZ: "Europe/Paris"
    restart: unless-stopped

volumes:
  simplex-data:
    name: simplex-data
  simplex-outbox:
    name: simplex-outbox
  simplex-inbox:
    name: simplex-inbox
