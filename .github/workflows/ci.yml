name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  structure:
    name: Integration structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          set -e
          test -f hacs.json
          test -f custom_components/simplex/manifest.json
          test -f custom_components/simplex/__init__.py
          test -f custom_components/simplex/const.py
          test -f custom_components/simplex/config_flow.py
          echo "✅ Required files present"

      - name: Validate JSON
        run: |
          python3 -c "import json; json.load(open('hacs.json'))"
          python3 -c "import json; json.load(open('custom_components/simplex/manifest.json'))"
          python3 -c "import json; json.load(open('custom_components/simplex/strings.json'))"
          python3 -c "import json; json.load(open('custom_components/simplex/translations/en.json'))"
          python3 -c "import json; json.load(open('custom_components/simplex/translations/fr.json'))"
          echo "✅ JSON files are valid"

      - name: Validate manifest fields
        run: |
          python3 << 'PY'
          import json, sys
          m = json.load(open("custom_components/simplex/manifest.json"))
          required = ["domain", "name", "version", "documentation", "issue_tracker", "codeowners", "config_flow"]
          missing = [k for k in required if k not in m]
          if missing:
              print("❌ Missing manifest keys:", missing)
              sys.exit(1)
          if m["domain"] != "simplex":
              print("❌ domain must be 'simplex'")
              sys.exit(1)
          print("✅ manifest.json OK – version", m["version"])
          PY

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The suite is dependency-free on purpose: it replays real captured
      # SimpleX Chat CLI frames through the integration's mapping, so it must
      # keep running without a Home Assistant installation.
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Compile all integration modules
        run: python3 -m compileall -q custom_components/simplex

  frontend:
    name: Messenger bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/messenger/package-lock.json

      - name: Type-check and build
        working-directory: frontend/messenger
        run: |
          npm ci
          npm run typecheck
          npm run build

      # HACS ships the repository as is (no build step), so the committed
      # bundle must be the one produced by the sources.
      - name: Committed bundle is up to date
        run: |
          git diff --exit-code -- custom_components/simplex/cards/simplex-messenger-card \
            || (echo "❌ Run 'npm run build' in frontend/messenger and commit the bundle." && exit 1)
